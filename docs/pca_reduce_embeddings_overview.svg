<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" role="img" aria-label="Learn the recipe on 1M rows, then apply it to all 98.5M" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="454" fill="#ffffff"/>
  <defs>
    <marker id="pca-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a92"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1a1a1a">Learn the recipe on 1M rows, then apply it to all 98.5M</text>
  <text x="24" y="50" font-size="11.5" fill="#555555">MolFormer on deduplicated AmpC: 98,489,350 rows, 768 to 271 numbers per molecule</text>

  <rect x="24" y="66" width="712" height="124" rx="8" fill="#f2f2ef" stroke="#9a9a92" stroke-width="1"/>
  <text x="40" y="90" font-weight="600" fill="#1a1a1a">Pass 1: learn the recipe (once)</text>
  <rect x="40" y="118" width="208" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="144" y="142" text-anchor="middle" font-weight="600" fill="#1a1a1a">Pick sample rows</text>
  <text x="144" y="158" text-anchor="middle" font-size="11.5" fill="#555555">1,000,000 indices, seed 42</text>
  <rect x="276" y="118" width="208" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="380" y="142" text-anchor="middle" font-weight="600" fill="#1a1a1a">One sequential scan</text>
  <text x="380" y="158" text-anchor="middle" font-size="11.5" fill="#555555">keep only the sampled rows</text>
  <rect x="512" y="118" width="208" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="616" y="142" text-anchor="middle" font-weight="600" fill="#1a1a1a">Fit PCA</text>
  <text x="616" y="158" text-anchor="middle" font-size="11.5" fill="#555555">271 directions, 95.01% kept</text>

  <rect x="480" y="210" width="240" height="56" rx="8" fill="#e3ecfb" stroke="#2f6fdc" stroke-width="2"/>
  <text x="600" y="234" text-anchor="middle" font-weight="600" fill="#1a1a1a">Saved recipe</text>
  <text x="600" y="250" text-anchor="middle" font-size="11.5" fill="#1a1a1a">.pca_params.npz, 271 × 768</text>
  <text x="40" y="242" font-size="11.5" fill="#555555">Rerun: if the recipe file exists, Pass 1 is skipped</text>

  <rect x="24" y="286" width="712" height="124" rx="8" fill="#f2f2ef" stroke="#9a9a92" stroke-width="1"/>
  <text x="40" y="310" font-weight="600" fill="#1a1a1a">Pass 2: apply it to every row</text>
  <rect x="40" y="338" width="208" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="144" y="362" text-anchor="middle" font-weight="600" fill="#1a1a1a">Stream all rows</text>
  <text x="144" y="378" text-anchor="middle" font-size="11.5" fill="#555555">500,000 rows per block</text>
  <rect x="276" y="338" width="208" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="380" y="362" text-anchor="middle" font-weight="600" fill="#1a1a1a">Apply the recipe</text>
  <text x="380" y="378" text-anchor="middle" font-size="11.5" fill="#555555">(row − mean) × directions</text>
  <rect x="512" y="338" width="208" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="616" y="362" text-anchor="middle" font-weight="600" fill="#1a1a1a">Write the output</text>
  <text x="616" y="378" text-anchor="middle" font-size="11.5" fill="#555555">98.5M × 271, same row order</text>

  <g fill="none" stroke="#9a9a92" stroke-width="1.25">
    <path d="M248 146H276" marker-end="url(#pca-arrow)"/>
    <path d="M484 146H512" marker-end="url(#pca-arrow)"/>
    <path d="M600 174V210" marker-end="url(#pca-arrow)"/>
    <path d="M480 238H380V338" marker-end="url(#pca-arrow)"/>
    <path d="M248 366H276" marker-end="url(#pca-arrow)"/>
    <path d="M484 366H512" marker-end="url(#pca-arrow)"/>
  </g>
  <text x="40" y="434" font-size="11.5" fill="#555555">Rerun: rows are written in order, so a killed job resumes from the last written row</text>
</svg>
